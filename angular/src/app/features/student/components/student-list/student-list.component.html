<h2>Students</h2>
<table>
  <thead>
    <tr>
      <th>Name</th>
      <th>Email</th>
      <th>Username</th>
      <th>Status</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody>
    @for(student of students | async; track student.id){
    <tr>
      <td>
        {{ student.firstName }}
        {{ student.lastName }}
      </td>
      <td>{{ student.email }}</td>
      <td>{{student.userName}}</td>
      <td>{{ student.userStatus }}</td>
      <td>
        <button [routerLink]="['/studentDetail']" [state]="{student:student}">
          View
        </button>
        <button [routerLink]="['/updateStudent']" [state]="{student:student}">
          Update
        </button>
        <button (click)="deleteStudent(student.id)">
          Delete
        </button>
        @if(student.userStatus === 'PENDING'){
        <button (click)="approveStudent(student.id)">
          Approve
        </button>
        }
        @if(hasBorrowedBooks(student.id)){
        <button [routerLink]="['/studentBorrowHistory']" [state]="{ student: student }">
          Borrowed Books
        </button>
        }
      </td>
    </tr>
    }
  </tbody>
</table>
