<div class="dialog-container">
    <h2 class="dialog-h2">Book Details</h2>

    <div class="book-details-dialog">

        <p>
            <strong>Title:</strong>
            {{book.title}}
        </p>

        <p>
            <strong>Author:</strong>
            {{book.author}}
        </p>

        <p>
            <strong>Category:</strong>
            {{book.category}}
        </p>

        <p>
            <strong>Available:</strong>
            {{book.available}}
        </p>

        <p>
            <strong>Quantity:</strong>
            {{book.quantity}}
        </p>

    </div>
</div>
