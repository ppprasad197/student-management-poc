<div class="dialog-container">
    <h2 class="dialog-h2">User Details</h2>

    <div class="user-details-dialog">

        <p>
            <strong>Name:</strong>
            {{user.firstName}} {{user.lastName}}
        </p>

        <p>
            <strong>Email:</strong>
            {{user.email}}
        </p>

        <p>
            <strong>Username:</strong>
            {{user.userName}}
        </p>

        <p>
            <strong>Role:</strong>
            {{user.role}}
        </p>

        <p>
            <strong>Status:</strong>
            {{user.userStatus}}
        </p>

    </div>
</div>
