@if(showPopup){

<div class="popup" (click)="closePopup()">

    <div class="popup-container" (click)="$event.stopPropagation()">

        <div class="popup-header">
            <h3>{{ popupTitle }}</h3>
        </div>

        <div class="popup-body">
            <p>{{ popupMessage }}</p>
        </div>

    </div>

</div>

}
