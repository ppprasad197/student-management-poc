<div class="dialog-container">
<h2 class="dialog-h2">Student Details</h2>

<div class="student-details-dialog">

    <p>
        <strong>Name:</strong>
        {{student.firstName}} {{student.lastName}}
    </p>

    <p>
        <strong>Email:</strong>
        {{student.email}}
    </p>

    <p>
        <strong>Username:</strong>
        {{student.userName}}
    </p>

    <p>
        <strong>Status:</strong>
        {{student.userStatus}}
    </p>

</div>
</div>
